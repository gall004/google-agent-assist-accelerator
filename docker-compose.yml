services:
  cloud-pubsub-interceptor:
    build:
      context: ./services/cloud-pubsub-interceptor
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    env_file: .env
    depends_on:
      - redis

  ui-connector:
    build:
      context: ./services/ui-connector
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - redis

  ui:
    build:
      context: ./services/ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - ui-connector

  sidecar:
    build:
      context: ./services/sidecar
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file: .env
    depends_on:
      - ui-connector

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:

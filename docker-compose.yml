services:
  cloud-pubsub-interceptor:
    build:
      context: ./services/cloud-pubsub-interceptor
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  ui-connector:
    build:
      context: ./services/ui-connector
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  ui:
    build:
      context: ./services/ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - ui-connector

  sidecar:
    build:
      context: ./services/sidecar
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file: .env
    depends_on:
      - ui-connector

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  redis-data:

